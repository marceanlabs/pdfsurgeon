[package]
name = "pdfsurgeon"
version = "0.11.1"
edition = "2024"
rust-version = "1.85"
description = "Take pages out of a PDF, put PDFs together, or split one into many, without breaking it"
license = "Apache-2.0"
repository = "https://github.com/marceanlabs/pdfsurgeon"
homepage = "https://github.com/marceanlabs/pdfsurgeon"
documentation = "https://docs.rs/pdfsurgeon"
readme = "README.md"
keywords = ["pdf", "cli", "merge", "split", "rotate"]
categories = ["command-line-utilities"]

[dependencies]
lopdf = "0.46.0"
rayon = "1.12.0"

# The parser allocates a great many small objects; glibc's malloc spends a fifth
# of the run time in page faults because of it. Chosen by measurement, not taste.
[dependencies.mimalloc]
version = "0.1"
optional = true

[features]
default = ["mimalloc-alloc"]
mimalloc-alloc = ["dep:mimalloc"]
